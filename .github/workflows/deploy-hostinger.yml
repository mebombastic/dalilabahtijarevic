name: Deploy to Hostinger

# Builds the site for a root domain (yourdomain.com/) and uploads it to
# Hostinger over FTP. Needs these repository secrets:
#   HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, HOSTINGER_FTP_PASSWORD
# (plus the VITE_SUPABASE_* secrets already used by the GitHub Pages build).
# Without the FTP secrets it still builds and offers the site as a
# downloadable zip ("hostinger-site") you can upload by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: hostinger-site
          path: dist
          include-hidden-files: true
      - name: Upload to Hostinger
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
